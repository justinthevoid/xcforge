name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          swift build -c release --disable-sandbox
          cp .build/release/XCForgeCLI .build/release/xcforge
          file .build/release/xcforge
          echo "BINARY_PATH=.build/release/xcforge" >> "$GITHUB_ENV"

      - name: Package tarball (binary + xcforgeWDA)
        run: |
          BINARY="${BINARY_PATH}"
          VERSION="${GITHUB_REF_NAME}"
          TARBALL="xcforge-${VERSION}-macos-arm64.tar.gz"
          STAGING="$(mktemp -d)"
          cp "${BINARY}" "${STAGING}/xcforge"
          cp -R xcforgeWDA "${STAGING}/xcforgeWDA"
          tar -czf "${TARBALL}" -C "${STAGING}" xcforge xcforgeWDA
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "${TARBALL}" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Package mcpb bundle
        run: |
          BINARY="${BINARY_PATH}"
          VERSION="${GITHUB_REF_NAME}"
          MCPB="xcforge-${VERSION}.mcpb"
          tar -czf "${MCPB}" -C "$(dirname "${BINARY}")" "$(basename "${BINARY}")"
          MCPB_SHA=$(shasum -a 256 "${MCPB}" | awk '{print $1}')
          echo "MCPB=${MCPB}" >> "$GITHUB_ENV"
          echo "MCPB_SHA=${MCPB_SHA}" >> "$GITHUB_ENV"

      - name: Update server.json
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DOWNLOAD_URL="https://github.com/justinthevoid/xcforge/releases/download/${VERSION}/xcforge-${VERSION}.mcpb"
          # Strip leading 'v' for the version field
          SEMVER="${VERSION#v}"
          jq \
            --arg ver "$SEMVER" \
            --arg url "$DOWNLOAD_URL" \
            --arg sha "$MCPB_SHA" \
            '.version_detail.version = $ver | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Upload release assets
        run: gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" "${MCPB}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated server.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          # Re-apply the jq patch on the freshly checked-out main
          jq \
            --arg ver "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/justinthevoid/xcforge/releases/download/${GITHUB_REF_NAME}/xcforge-${GITHUB_REF_NAME}.mcpb" \
            --arg sha "$MCPB_SHA" \
            '.version = $ver | .version_detail.version = $ver | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > server.json.tmp && mv server.json.tmp server.json
          git add server.json
          git diff --cached --quiet || git commit -m "chore: update server.json for ${GITHUB_REF_NAME}"
          git push origin main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SEMVER="${VERSION#v}"
          TARBALL_URL="https://github.com/justinthevoid/xcforge/releases/download/${VERSION}/${TARBALL}"

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/justinthevoid/homebrew-tap.git /tmp/tap
          cd /tmp/tap

          cat > Formula/xcforge.rb << EOF
          class Xcforge < Formula
            desc "MCP server and CLI for iOS development"
            homepage "https://github.com/justinthevoid/xcforge"
            version "${SEMVER}"
            license "MIT"

            on_macos do
              on_arm do
                url "${TARBALL_URL}"
                sha256 "${SHA256}"
              end
            end

            depends_on :macos

            def install
              bin.install "xcforge"
              (share/"xcforge").install "xcforgeWDA"
            end

            def caveats
              <<~CAVEATS
                xcforgeWDA (UI automation runner source) installed at:
                  #{opt_share}/xcforge/xcforgeWDA

                The first UI automation call builds the runner once via xcodebuild,
                so Xcode is required at runtime for UI automation features.
                CLI / build / test / log tools work without Xcode-build of the runner.
              CAVEATS
            end

            test do
              assert_match "xcforge", shell_output("#{bin}/xcforge --help 2>&1", 0)
              assert_predicate share/"xcforge/xcforgeWDA/xcforgeWDA.xcodeproj", :exist?
            end
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Formula/xcforge.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/xcforge.rb
          git commit -m "Update xcforge to ${VERSION}"
          git push
